<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://localhost:54321 http://127.0.0.1:54321; base-uri 'none'; form-action 'self'" />
  <meta name="referrer" content="same-origin" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="booting">
  <!-- Login / daftar -->
  <div class="auth" id="auth">
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
        </div>
        <span>Catatan</span>
      </div>
      <h1 id="authTitle">Selamat datang kembali</h1>
      <p class="auth-sub" id="authSub">Masuk untuk membuka catatanmu di perangkat mana pun.</p>
      <div class="auth-setup hidden" id="authSetup" role="alert"></div>

      <div class="seg auth-seg" id="authSeg">
        <button type="button" data-auth="login" class="active">Masuk</button>
        <button type="button" data-auth="register">Daftar</button>
      </div>

      <form id="authForm" novalidate>
        <label class="field" id="emailField">
          <span>Email</span>
          <input id="authEmail" type="email" autocomplete="email" placeholder="nama@email.com" required />
        </label>
        <label class="field" id="pwField">
          <span class="field-head">Kata sandi <button type="button" class="link-btn" id="forgotBtn">Lupa kata sandi?</button></span>
          <div class="pw-wrap">
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="8" />
            <button type="button" class="pw-toggle" id="pwToggle" title="Tampilkan kata sandi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <small class="hint" id="pwHint">Minimal 8 karakter.</small>
        </label>
        <div class="auth-error" id="authError" role="alert"></div>
        <div class="auth-info" id="authInfo" role="status"></div>
        <button class="btn-primary auth-submit" id="authSubmit" type="submit">Masuk</button>
        <button type="button" class="link-btn back-link hidden" id="backToLoginBtn">← Kembali ke halaman masuk</button>
      </form>
    </div>
  </div>

  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
        </div>
        <span>Catatan</span>
      </div>

      <button class="btn-primary" id="newNoteBtn" title="Catatan baru (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Catatan baru
      </button>

      <nav class="nav">
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Semua catatan</span><em class="count" data-count="all">0</em>
        </button>
        <button class="nav-item" data-view="pinned">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          <span>Disematkan</span><em class="count" data-count="pinned">0</em>
        </button>
        <button class="nav-item" data-view="trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Sampah</span><em class="count" data-count="trash">0</em>
        </button>
      </nav>

      <div class="section-title">Tag</div>
      <div class="tag-list" id="tagList"></div>

      <div class="user-box">
        <span class="avatar" id="userAvatar">?</span>
        <span class="user-email" id="userEmail"></span>
        <button class="icon-btn" id="logoutBtn" title="Keluar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="themeBtn" title="Ganti tema">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        </button>
        <button class="icon-btn" id="exportBtn" title="Ekspor catatan (JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button class="icon-btn" id="importBtn" title="Impor catatan (JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </button>
        <input type="file" id="importInput" accept="application/json" hidden />
      </div>
    </aside>

    <!-- Note list -->
    <section class="list-pane">
      <header class="list-header">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Cari catatan…" autocomplete="off" />
          <kbd>⌘K</kbd>
        </div>
        <div class="list-meta">
          <h2 id="listTitle">Semua catatan</h2>
          <select id="sortSelect" title="Urutkan">
            <option value="updated">Terakhir diubah</option>
            <option value="created">Tanggal dibuat</option>
            <option value="title">Judul A–Z</option>
          </select>
        </div>
      </header>
      <div class="note-list" id="noteList"></div>
    </section>

    <!-- Editor -->
    <main class="editor-pane" id="editorPane">
      <div class="empty-state" id="emptyState">
        <div class="empty-illus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
        <h3>Pilih atau buat catatan</h3>
        <p>Tulis ide, daftar tugas, atau apa saja. Semua tersimpan otomatis di akunmu dan bisa dibuka dari perangkat mana pun.</p>
        <button class="btn-primary" id="emptyNewBtn">Mulai menulis</button>
      </div>

      <div class="editor hidden" id="editor">
        <div class="editor-toolbar">
          <button class="icon-btn back-btn" id="backBtn" title="Kembali">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span class="save-status" id="saveStatus">Tersimpan</span>
          <div class="toolbar-spacer"></div>

          <div class="seg" id="modeSeg">
            <button data-mode="edit" class="active">Tulis</button>
            <button data-mode="preview">Pratinjau</button>
          </div>

          <div class="color-picker" id="colorPicker" title="Warna catatan"></div>

          <button class="icon-btn" id="pinBtn" title="Sematkan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          </button>
          <button class="icon-btn" id="restoreBtn" title="Pulihkan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="icon-btn danger" id="deleteBtn" title="Hapus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>

        <div class="editor-body">
          <input class="title-input" id="titleInput" placeholder="Judul" maxlength="140" />
          <div class="tags-row" id="tagsRow">
            <div class="tag-chips" id="tagChips"></div>
            <input class="tag-input" id="tagInput" placeholder="+ tambah tag" maxlength="24" />
          </div>
          <textarea class="content-input" id="contentInput" placeholder="Mulai menulis… (mendukung Markdown: # judul, **tebal**, - [ ] tugas)"></textarea>
          <article class="preview hidden" id="preview"></article>
        </div>

        <footer class="editor-footer">
          <span id="wordCount">0 kata</span>
          <span id="dateInfo"></span>
        </footer>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"
          integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb"
          crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
